name: Build Font

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "sfd"
        type: choice
        options:
          - sfd
          - ufo
      debug_mode:
        description: "Enable debug output"
        required: false
        default: false
        type: boolean

env:
  SFD_FILE: "sources/H34-Tulis.sfd"
  UFO_FILE: "sources/H34-Tulis.ufo"
  VENV_DIR: "build/bin"
  FEA_DIR: "fea"
  REQUIREMENTS_FILE: "requirements.txt"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y fontforge

    - name: Create virtual environment
      run: |
        python -m venv build
        source ${{ env.VENV_DIR }}/activate

    - name: Install Python dependencies
      run: |
        source ${{ env.VENV_DIR }}/activate
        if [ -f "${{ env.REQUIREMENTS_FILE }}" ]; then
          pip install -r ${{ env.REQUIREMENTS_FILE }}
        else
          pip install fontmake
        fi

    # ------------------------------------------------------------------
    # STEP 1: BUILD UFO (if building from SFD)
    # ------------------------------------------------------------------
    - name: Convert SFD to UFO (only for SFD build)
      if: ${{ inputs.build_type == 'sfd' }}
      run: |
        source ${{ env.VENV_DIR }}/activate

        if [ ! -f "${{ env.SFD_FILE }}" ]; then
          echo "ERROR: SFD source file missing"
          exit 1
        fi

        echo "Cleaning old UFO directory..."
        rm -rf "${{ env.UFO_FILE }}"

        echo "Converting SFD → UFO..."
        fontforge -lang=ff -c "Open('${{ env.SFD_FILE }}'); Generate('${{ env.UFO_FILE }}', '', 64)"
        echo "Conversion complete."

    - name: Validate UFO exists
      run: |
        if [ ! -d "${{ env.UFO_FILE }}" ]; then
          echo "ERROR: UFO directory not found!"
          exit 1
        fi
        echo "UFO found: ${{ env.UFO_FILE }}"

    # ------------------------------------------------------------------
    # STEP 2: COMBINE FEA (AFTER UFO EXISTS)
    # ------------------------------------------------------------------
    - name: Combine FEA files into UFO
      run: |
        source ${{ env.VENV_DIR }}/activate

        UFO_FEATURES_FILE="${{ env.UFO_FILE }}/features.fea"

        echo "Combining FEA files..."

        temp_combined="/tmp/combined_features_temp.fea"
        > "$temp_combined"

        echo "# Combined feature file" >> "$temp_combined"
        echo "# Generated on: $(date)" >> "$temp_combined"
        echo "" >> "$temp_combined"

        if [ -d "${{ env.FEA_DIR }}" ]; then
          for fea in "${{ env.FEA_DIR }}"/*.fea; do
            [ -f "$fea" ] || continue
            echo "# From: $(basename "$fea")" >> "$temp_combined"
            cat "$fea" >> "$temp_combined"
            echo "" >> "$temp_combined"
          done
        fi

        echo "Appending combined FEA → UFO..."
        cat "$temp_combined" >> "$UFO_FEATURES_FILE"

        rm "$temp_combined"
        echo "FEA merge complete."

    # ------------------------------------------------------------------
    # STEP 3: BUILD FONT
    # ------------------------------------------------------------------
    - name: Build OTF from UFO
      run: |
        source ${{ env.VENV_DIR }}/activate
        fontmake -u "${{ env.UFO_FILE }}" -o otf --keep-overlaps
        echo "OTF build complete."

    # ------------------------------------------------------------------
    # STEP 4: ARTIFACTS
    # ------------------------------------------------------------------
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: font-files-${{ github.run_number }}-${{ inputs.build_type }}
        path: |
          *.otf
          ${{ env.UFO_FILE }}/
        retention-days: 30

    - name: List generated files
      run: |
        ls -la *.otf || echo "No OTF files found"
        ls -la ${{ env.UFO_FILE }}/ || echo "No UFO directory found"
